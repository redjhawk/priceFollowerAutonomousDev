# Secrets are created by scripts/create-secrets.sh and are never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000  # lets the runner user read the mounted SSH Secret
      containers:
      - name: runner
        image: local-gh-runner:latest
        imagePullPolicy: Never
        env:
        - name: REPO_URL
          value: "https://github.com/redjhawk/pricetracker"
        - name: RUNNER_NAME
          value: "barcelona"
        - name: RUNNER_LABELS
          value: "barcelona"
        - name: GITHUB_PAT
          valueFrom:
            secretKeyRef:
              name: factory-secrets
              key: runner-pat
        # Claude subscription token for the ai-dev workflow; it stays on barcelona
        - name: CLAUDE_CODE_OAUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: factory-secrets
              key: claude-oauth-token
              optional: true
        volumeMounts:
        - name: work
          mountPath: /home/runner/_work
        - name: cache
          mountPath: /home/runner/.cache
        - name: gopath
          mountPath: /home/runner/go
        - name: npm
          mountPath: /home/runner/.npm
        - name: ssh
          mountPath: /etc/factory-ssh
          readOnly: true
      # Persistent state lives on barcelona under /srv/factory (see scripts/install-barcelona.sh)
      volumes:
      - name: work
        hostPath:
          path: /srv/factory/runner/work
          type: Directory
      - name: cache
        hostPath:
          path: /srv/factory/runner/cache
          type: Directory
      - name: gopath
        hostPath:
          path: /srv/factory/runner/go
          type: Directory
      - name: npm
        hostPath:
          path: /srv/factory/runner/npm
          type: Directory
      - name: ssh
        secret:
          secretName: factory-ssh
          defaultMode: 0440
