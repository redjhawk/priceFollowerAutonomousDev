# Secrets are created by scripts/create-secrets.sh and are never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-engine
  namespace: default
spec:
  replicas: 0  # disabled until the agent engine is implemented (docs/components/agent-engine.md)
  selector:
    matchLabels:
      app: ai-agent-engine
  template:
    metadata:
      labels:
        app: ai-agent-engine
    spec:
      containers:
      - name: agent
        image: ai-agent-engine:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: ANTHROPIC_MODEL
          value: "claude-sonnet-5-5"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: factory-secrets
              key: github-token
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: factory-secrets
              key: anthropic-api-key
        - name: LINEAR_API_KEY
          valueFrom:
            secretKeyRef:
              name: factory-secrets
              key: linear-api-key
        - name: LINEAR_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: factory-secrets
              key: linear-webhook-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000  # lets the runner user read the mounted SSH Secret
      containers:
      - name: runner
        image: local-gh-runner:latest
        imagePullPolicy: Never
        env:
        - name: REPO_URL
          value: "https://github.com/redjhawk/pricetracker"
        - name: RUNNER_NAME
          value: "barcelona"
        - name: RUNNER_LABELS
          value: "barcelona"
        - name: GITHUB_PAT
          valueFrom:
            secretKeyRef:
              name: factory-secrets
              key: runner-pat
        volumeMounts:
        - name: work
          mountPath: /home/runner/_work
        - name: cache
          mountPath: /home/runner/.cache
        - name: gopath
          mountPath: /home/runner/go
        - name: npm
          mountPath: /home/runner/.npm
        - name: ssh
          mountPath: /etc/factory-ssh
          readOnly: true
      # Persistent state lives on barcelona under /srv/factory (see scripts/install-barcelona.sh)
      volumes:
      - name: work
        hostPath:
          path: /srv/factory/runner/work
          type: Directory
      - name: cache
        hostPath:
          path: /srv/factory/runner/cache
          type: Directory
      - name: gopath
        hostPath:
          path: /srv/factory/runner/go
          type: Directory
      - name: npm
        hostPath:
          path: /srv/factory/runner/npm
          type: Directory
      - name: ssh
        secret:
          secretName: factory-ssh
          defaultMode: 0440
