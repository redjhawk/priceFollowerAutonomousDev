# Copy to k3s/factory.secret.yaml (git-ignored), fill in, then:
#   kubectl apply -f k3s/factory.secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: factory-secrets
  namespace: default
type: Opaque
stringData:
  github-token: "YOUR_GITHUB_PAT"          # agent clone/push
  runner-token: "YOUR_RUNNER_REG_TOKEN"    # Settings > Actions > Runners > New (expires in 1h)
  anthropic-api-key: "YOUR_ANTHROPIC_API_KEY"
  linear-api-key: "YOUR_LINEAR_API_KEY"
  linear-webhook-secret: "YOUR_LINEAR_WEBHOOK_SECRET"
