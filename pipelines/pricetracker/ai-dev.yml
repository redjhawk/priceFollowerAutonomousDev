# Copy to pricetracker/.github/workflows/ai-dev.yml
# AI developer: an issue labelled "ai-dev" (or an "@claude" comment) makes Claude implement it on a
# branch, following AGENTS.md and the project skills/roles. You review and merge the PR; merging to
# main triggers ci-deploy. Runs on the dev runner on barcelona (no deploy key there).
name: ai-dev

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ai-dev-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only the owner may trigger work on barcelona and use the Claude subscription.
    if: >-
      github.repository == 'redjhawk/pricetracker' &&
      github.actor == 'redjhawk' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev')) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: [self-hosted, barcelona-dev]
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One PR per issue: the action starts a new timestamped branch on every issue-triggered run,
      # so once an ai-dev PR exists for the issue, follow-ups must happen in that PR (where the
      # action checks out the PR branch and Claude's commits land in the same PR).
      - name: Redirect to the existing pull request
        id: guard
        if: ${{ github.event.issue && !github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          pr=$(api "$repo_api/pulls?state=open&per_page=100" \
                 | jq -r --arg prefix "ai-dev #$ISSUE_NUMBER:" '[.[] | select(.title | startswith($prefix))][0].number // empty')
          if [ -n "$pr" ]; then
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            jq -n --arg body "There is already a pull request for this issue: #$pr. Please continue there with an \`@claude\` comment, so all changes stay in one PR." '{body: $body}' \
              | api -X POST "$repo_api/issues/$ISSUE_NUMBER/comments" -d @- >/dev/null
            echo "Existing PR #$pr for issue #$ISSUE_NUMBER; Claude not started."
          fi

      - name: Install dependencies
        if: steps.guard.outputs.pr == ''
        run: |
          npm ci
          go mod download

      # The Claude token lives on barcelona (k8s Secret -> runner pod env), not in GitHub
      - name: Load Claude token from barcelona
        if: steps.guard.outputs.pr == ''
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on the runner; run scripts/create-secrets.sh on barcelona"
            exit 1
          fi
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          echo "CLAUDE_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.guard.outputs.pr == ''
        with:
          # Subscription token from `claude setup-token`: runs use Claude Pro/Max, not the API
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          label_trigger: ai-dev
          trigger_phrase: "@claude"
          branch_prefix: ai-dev/
          claude_args: |
            --model claude-opus-5-5
            --effort low
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,TodoWrite,Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(gofmt:*),Bash(npm ci),Bash(npm run build),Bash(npm run dev:*),Bash(npm run test:*),Bash(npx tsc:*),Bash(npx playwright test:*),Bash(go run:*),Bash(curl -s http://localhost:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git branch --show-current),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD),Bash(git push -u origin HEAD)"
            --append-system-prompt "Before any work, read AGENTS.md and follow it fully: read the four project skills it lists (.agents/skills/ and project-skills/) and run the staged workflow in doc/workflow/WORKFLOW.md, using a separate Task subagent for each role in .agents/roles/. The issue is the user's development request. When a product decision, API contract approval or refactoring decision is needed, ask it in the issue and stop; the user answers with an @claude comment. You are already on this issue's branch: never create or switch branches. Use small Conventional Commits that end with 'Refs: #<issue number>', and publish them with exactly `git push origin HEAD`. Do not open the pull request yourself: the workflow opens it after you finish. For QA, start the app with npm run dev in the background and test it with Playwright (Chromium is installed); stop it when done."

      # Open the single PR for this issue once Claude has commits. Skipped for comments on PRs (the PR
      # already exists) and when Claude made no commits (e.g. it stopped to ask a question). The title
      # prefix "ai-dev #<issue>:" is what the guard step above looks for.
      - name: Open pull request
        if: steps.claude.outputs.branch_name != '' && github.event.issue && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          base="${{ github.event.repository.default_branch }}"

          ahead=$(api "$repo_api/compare/$base...$BRANCH" | jq -r .ahead_by 2>/dev/null || echo 0)
          if [ "${ahead:-0}" = 0 ]; then
            echo "No commits on $BRANCH yet; not opening a PR."
            exit 0
          fi

          existing=$(api "$repo_api/pulls?state=open&per_page=100" \
                       | jq -r --arg prefix "ai-dev #$ISSUE_NUMBER:" '[.[] | select(.title | startswith($prefix))][0].html_url // empty')
          if [ -n "$existing" ]; then
            echo "A PR for issue #$ISSUE_NUMBER is already open: $existing; not opening another."
            exit 0
          fi

          url=$(jq -n --arg title "ai-dev #$ISSUE_NUMBER: $ISSUE_TITLE" --arg head "$BRANCH" --arg base "$base" \
                  --arg body "Implemented by Claude (ai-dev workflow) for #$ISSUE_NUMBER.

          Closes #$ISSUE_NUMBER" '{title: $title, head: $head, base: $base, body: $body}' \
                | api -X POST "$repo_api/pulls" -d @- | jq -r .html_url)
          echo "Opened $url"
          echo "### Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
